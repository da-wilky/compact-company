[package]
name = "compact-company"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1"
hex = "0.4.3"
jiff = { version = "0.2.42", features = ["tzdb-bundle-always", "serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "rustls-native-certs", "aws-lc-rs"] }
lopdf = "0.47"
object_store = { version = "0.14", features = ["aws"] }
openidconnect = { version = "4.1.0", default-features = false }
quick-xml = "0.42"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
tar = "0.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
toml = "1.2"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "6", features = ["decimal"] }
utoipa-axum = "0.3"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }

[dev-dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
http-body-util = "0.1.5"
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
