[package]
name = "compact-company"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
object_store = { version = "0.14", features = ["aws"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.2"
utoipa = "6"
utoipa-axum = "0.3"

[dev-dependencies]
http-body-util = "0.1.5"
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
