{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}} · compact-company</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header>
<a class="brand" href="/">compact-company</a>
{{with .User}}<div class="user">{{t "layout.signed_in_as" .DisplayName}}
<form method="post" action="/logout"><button>{{t "layout.logout"}}</button></form></div>{{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
